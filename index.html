<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>Tension Lines</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;400;500&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Layout: one full-bleed sheet; a small instrument strip floats at the bottom edge. */
:root {
  --paper: #e9ecef;      /* cool blue-grey drawing sheet */
  --ink: #1b2430;        /* graphite-blue trace ink */
  --taut: #c23a2b;       /* stretched spring */
  --slack: #2f5fb3;      /* compressed spring */
  --panel: rgba(250, 251, 252, 0.86);
  --line: rgba(27, 36, 48, 0.16);
  --muted: #5d6876;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10141a; --ink: #dfe6ee; --taut: #ff7a5c; --slack: #7fa8ff;
    --panel: rgba(24, 30, 38, 0.86); --line: rgba(223, 230, 238, 0.16); --muted: #93a0ae;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10141a; --ink: #dfe6ee; --taut: #ff7a5c; --slack: #7fa8ff;
  --panel: rgba(24, 30, 38, 0.86); --line: rgba(223, 230, 238, 0.16); --muted: #93a0ae;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); overflow: hidden; font-family: var(--mono); }
#stage { position: fixed; inset: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#live { cursor: crosshair; }
#live.off { cursor: default; }

.strip {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px;
  pointer-events: none;
}
.controls, .readout { pointer-events: auto; background: var(--panel); border: 1px solid var(--line);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.controls { display: flex; gap: 4px; padding: 4px; border-radius: 10px; }
.controls button {
  font-family: var(--display); font-weight: 500; font-size: 15px; letter-spacing: 0.01em;
  color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 7px;
  padding: 8px 16px; cursor: pointer;
}
.controls button:hover { border-color: var(--line); }
.controls button:focus-visible { outline: 2px solid var(--slack); outline-offset: 1px; }
.controls button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.readout { border-radius: 8px; padding: 8px 12px; font-size: 11px; line-height: 1.6; color: var(--muted);
  font-variant-numeric: tabular-nums; display: grid; grid-template-columns: auto auto; column-gap: 14px; min-width: 0; }
.readout b { font-weight: 500; color: var(--ink); }
.hint {
  position: fixed; top: calc(18px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  font-family: var(--display); font-weight: 700; font-size: clamp(20px, 3.2vw, 30px); letter-spacing: -0.01em;
  pointer-events: none; transition: opacity .6s ease; text-wrap: balance;
}
.hint small { display: block; font-family: var(--mono); font-weight: 300; font-size: 11px; letter-spacing: .04em;
  color: var(--muted); margin-top: 6px; }
.hint.gone { opacity: 0; }
.toast { position: fixed; left: 50%; top: calc(18px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--paper); font-size: 12px; padding: 6px 12px; border-radius: 6px; }
@media (max-width: 520px) { .readout { font-size: 10px; } .controls button { padding: 8px 12px; } }
</style>

<div id="stage">
  <canvas id="traces"></canvas>
  <canvas id="live"></canvas>
</div>
<div class="hint" id="hint">Draw a line. Let go. Watch it pull tight.
  <small>EXAMPLE GESTURE PLAYING · ENDS ARE PINNED · SPRINGS REST AT 60% OF DRAWN LENGTH</small></div>
<div class="toast" id="toast" hidden></div>
<div class="strip">
  <div class="controls" role="toolbar" aria-label="Drawing controls">
    <button id="drawBtn" type="button" aria-pressed="true">Draw</button>
    <button id="resetBtn" type="button">Reset</button>
    <button id="saveBtn" type="button">Save</button>
  </div>
  <div class="readout" aria-live="off">
    <span>k <b>0.40</b> · rest <b>60%</b></span><span>damping <b>0.9985</b>/step</span>
    <span>t <b id="rt">0.0</b> s · nodes <b id="rn">0</b></span><span>energy <b id="re">0</b></span>
  </div>
</div>

<script>
(() => {
  // Physics constants. Pure spring dynamics: no noise anywhere.
  const K = 0.40;          // neighbour spring stiffness
  const KB = 0.07;         // second-neighbour (bending) spring stiffness
  const REST = 0.60;       // rest length as a fraction of the drawn spacing -> starts under tension
  const DAMP = 0.9985;     // velocity retained per substep
  const SUB = 6;           // substeps per frame
  const TRACE_ALPHA = 0.05;
  const MAX_FRAMES = 3000;

  const traceCv = document.getElementById("traces");
  const liveCv = document.getElementById("live");
  const tctx = traceCv.getContext("2d");
  const lctx = liveCv.getContext("2d");
  // Traces accumulate as an alpha mask, then get tinted with the theme ink, so a theme switch recolours history.
  let mask = document.createElement("canvas");
  let mctx = mask.getContext("2d");
  let W = 0, H = 0, DPR = 1;

  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  let colors = {};
  const readColors = () => { colors = { paper: css("--paper"), ink: css("--ink"), taut: css("--taut"), slack: css("--slack") }; };

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    const old = mask;
    mask = document.createElement("canvas");
    mask.width = Math.round(W * DPR); mask.height = Math.round(H * DPR);
    mctx = mask.getContext("2d");
    if (old.width) mctx.drawImage(old, 0, 0);
    mctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    for (const cv of [traceCv, liveCv]) { cv.width = mask.width; cv.height = mask.height; }
    lctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    maskDirty = true;
  }

  let maskDirty = true;
  function tintTraces() {
    tctx.setTransform(1, 0, 0, 1, 0, 0);
    tctx.globalCompositeOperation = "source-over";
    tctx.clearRect(0, 0, traceCv.width, traceCv.height);
    tctx.drawImage(mask, 0, 0);
    tctx.globalCompositeOperation = "source-in";
    tctx.fillStyle = colors.ink;
    tctx.fillRect(0, 0, traceCv.width, traceCv.height);
    tctx.globalCompositeOperation = "source-over";
    maskDirty = false;
  }

  // ---- Curves ----
  const curves = [];   // {x,y,vx,vy (Float64Array), n, rest, restB, frame, calm, done}
  let stroke = null;   // points of the gesture in progress
  let penOn = true;

  function resample(pts) {
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const L = cum[cum.length - 1];
    const spacing = Math.min(14, Math.max(4, L / 260));
    const n = Math.max(3, Math.round(L / spacing) + 1);
    const step = L / (n - 1);
    const x = new Float64Array(n), y = new Float64Array(n);
    let j = 0;
    for (let i = 0; i < n; i++) {
      const s = i * step;
      while (j < cum.length - 2 && cum[j + 1] < s) j++;
      const seg = cum[j + 1] - cum[j] || 1;
      const t = Math.min(1, Math.max(0, (s - cum[j]) / seg));
      x[i] = pts[j][0] + (pts[j + 1][0] - pts[j][0]) * t;
      y[i] = pts[j][1] + (pts[j + 1][1] - pts[j][1]) * t;
    }
    return { x, y, n, step };
  }

  function addCurve(pts) {
    let L = 0;
    for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (L < 24 || pts.length < 3) return;
    const r = resample(pts);
    curves.push({
      x: r.x, y: r.y, vx: new Float64Array(r.n), vy: new Float64Array(r.n), n: r.n,
      rest: r.step * REST, restB: 2 * r.step * REST, frame: 0, calm: 0, done: false, energy: 0
    });
    traceCurve(curves[curves.length - 1], 0.22); // the original gesture, recorded once a little darker
  }

  function spring(c, i, j, rest, k) {
    const dx = c.x[j] - c.x[i], dy = c.y[j] - c.y[i];
    const d = Math.hypot(dx, dy) || 1e-9;
    const f = k * (d - rest) / d;
    const fx = f * dx, fy = f * dy;
    c.fx[i] += fx; c.fy[i] += fy; c.fx[j] -= fx; c.fy[j] -= fy;
  }

  function stepCurve(c) {
    const n = c.n;
    if (!c.fx) { c.fx = new Float64Array(n); c.fy = new Float64Array(n); }
    for (let s = 0; s < SUB; s++) {
      c.fx.fill(0); c.fy.fill(0);
      for (let i = 0; i < n - 1; i++) spring(c, i, i + 1, c.rest, K);
      for (let i = 0; i < n - 2; i++) spring(c, i, i + 2, c.restB, KB);
      // endpoints (0 and n-1) are pinned: skip them in integration
      for (let i = 1; i < n - 1; i++) {
        c.vx[i] = (c.vx[i] + c.fx[i]) * DAMP;
        c.vy[i] = (c.vy[i] + c.fy[i]) * DAMP;
        c.x[i] += c.vx[i];
        c.y[i] += c.vy[i];
      }
    }
    let e = 0;
    for (let i = 1; i < n - 1; i++) e += c.vx[i] * c.vx[i] + c.vy[i] * c.vy[i];
    c.energy = 0.5 * e;
    c.frame++;
    c.calm = (e / n < 2e-5) ? c.calm + 1 : 0;
    if ((c.frame > 90 && c.calm > 45) || c.frame > MAX_FRAMES) { c.done = true; traceCurve(c, 0.35); }
  }

  function pathCurve(ctx, c) {
    ctx.beginPath();
    ctx.moveTo(c.x[0], c.y[0]);
    for (let i = 1; i < c.n - 1; i++) {
      const mx = (c.x[i] + c.x[i + 1]) / 2, my = (c.y[i] + c.y[i + 1]) / 2;
      ctx.quadraticCurveTo(c.x[i], c.y[i], mx, my);
    }
    ctx.lineTo(c.x[c.n - 1], c.y[c.n - 1]);
  }

  function traceCurve(c, alpha) {
    mctx.globalAlpha = alpha;
    mctx.strokeStyle = "#000";
    mctx.lineWidth = 0.8;
    mctx.lineJoin = mctx.lineCap = "round";
    pathCurve(mctx, c);
    mctx.stroke();
    mctx.globalAlpha = 1;
    maskDirty = true;
  }

  // Live layer: active curves coloured by spring strain (red = stretched, blue = compressed).
  function drawLive() {
    lctx.clearRect(0, 0, W, H);
    lctx.lineCap = "round";
    for (const c of curves) {
      if (c.done) continue;
      lctx.lineWidth = 2;
      for (let i = 0; i < c.n - 1; i++) {
        const d = Math.hypot(c.x[i + 1] - c.x[i], c.y[i + 1] - c.y[i]);
        const strain = (d - c.rest) / c.rest;
        lctx.strokeStyle = strain > 0 ? colors.taut : colors.slack;
        lctx.globalAlpha = Math.min(1, 0.25 + Math.abs(strain) * 1.4);
        lctx.beginPath(); lctx.moveTo(c.x[i], c.y[i]); lctx.lineTo(c.x[i + 1], c.y[i + 1]); lctx.stroke();
      }
      lctx.globalAlpha = 1;
    }
    for (const c of curves) drawPins(lctx, c, c.done ? 0.55 : 1);
    if (stroke && stroke.length > 1) {
      lctx.strokeStyle = colors.ink; lctx.lineWidth = 1.6; lctx.lineJoin = "round";
      lctx.beginPath(); lctx.moveTo(stroke[0][0], stroke[0][1]);
      for (const p of stroke) lctx.lineTo(p[0], p[1]);
      lctx.stroke();
    }
  }

  function drawPins(ctx, c, alpha) {
    ctx.globalAlpha = alpha;
    for (const i of [0, c.n - 1]) {
      ctx.fillStyle = colors.paper; ctx.strokeStyle = colors.ink; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(c.x[i], c.y[i], 3.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ---- Loop ----
  const rt = document.getElementById("rt"), rn = document.getElementById("rn"), re = document.getElementById("re");
  let simTime = 0;
  function frame() {
    let active = null;
    for (const c of curves) {
      if (c.done) continue;
      stepCurve(c);
      if (!c.done) traceCurve(c, TRACE_ALPHA);
      active = c;
    }
    if (maskDirty) tintTraces();
    drawLive();
    if (active) {
      simTime = active.frame / 60;
      rt.textContent = simTime.toFixed(1);
      rn.textContent = active.n;
      re.textContent = active.energy < 0.01 ? active.energy.toExponential(1) : active.energy.toFixed(2);
    } else if (curves.length) {
      re.textContent = "settled";
    }
    requestAnimationFrame(frame);
  }

  // ---- Input ----
  const hint = document.getElementById("hint");
  liveCv.addEventListener("pointerdown", e => {
    if (!penOn || e.button > 0) return;
    liveCv.setPointerCapture(e.pointerId);
    stroke = [[e.clientX, e.clientY]];
    hint.classList.add("gone");
  });
  liveCv.addEventListener("pointermove", e => {
    if (!stroke) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of evs) {
      const last = stroke[stroke.length - 1];
      if (Math.hypot(ev.clientX - last[0], ev.clientY - last[1]) >= 1.5) stroke.push([ev.clientX, ev.clientY]);
    }
  });
  const end = () => { if (stroke) { addCurve(stroke); stroke = null; } };
  liveCv.addEventListener("pointerup", end);
  liveCv.addEventListener("pointercancel", () => { stroke = null; });

  const drawBtn = document.getElementById("drawBtn");
  drawBtn.addEventListener("click", () => {
    penOn = !penOn;
    drawBtn.setAttribute("aria-pressed", String(penOn));
    liveCv.classList.toggle("off", !penOn);
  });
  document.getElementById("resetBtn").addEventListener("click", () => {
    curves.length = 0; stroke = null;
    mctx.save(); mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.clearRect(0, 0, mask.width, mask.height); mctx.restore();
    maskDirty = true;
    rt.textContent = "0.0"; rn.textContent = "0"; re.textContent = "0";
    showToast("Sheet cleared");
  });

  // ---- Save ----
  const toast = document.getElementById("toast");
  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg; toast.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { toast.hidden = true; }, 2200);
  }
  let downloads = null;
  if (window.claude && window.claude.use) window.claude.use("downloads").then(d => { downloads = d; }).catch(() => {});

  document.getElementById("saveBtn").addEventListener("click", () => {
    const out = document.createElement("canvas");
    out.width = traceCv.width; out.height = traceCv.height;
    const o = out.getContext("2d");
    o.fillStyle = colors.paper; o.fillRect(0, 0, out.width, out.height);
    if (maskDirty) tintTraces();
    o.drawImage(traceCv, 0, 0);
    o.setTransform(DPR, 0, 0, DPR, 0, 0);
    for (const c of curves) drawPins(o, c, 0.7);
    const name = "tension-lines-" + new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-") + ".png";
    out.toBlob(async blob => {
      if (!blob) { showToast("Could not render the image"); return; }
      if (downloads) {
        try { await downloads.save({ filename: name, data: blob }); showToast("Saved " + name); }
        catch (err) { showToast(err && err.code === "declined" ? "Save cancelled" : "Saving is unavailable here"); }
        return;
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      showToast("Saved " + name);
    }, "image/png");
  });

  // ---- Theme changes recolour the record ----
  const recolor = () => { readColors(); maskDirty = true; };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", recolor);
  new MutationObserver(recolor).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  window.addEventListener("resize", resize);

  // ---- Start with one example gesture: a hand-like sweep with a loop, deterministic ----
  readColors();
  resize();
  (function example() {
    const pts = [];
    const cx = W / 2, cy = H * 0.46, a = Math.min(W * 0.4, 520), b = Math.min(H * 0.22, 220);
    for (let t = 0; t <= 1.0001; t += 0.004) {
      const u = t * 2 - 1;
      pts.push([cx + a * u + 70 * Math.sin(t * Math.PI * 5), cy + b * Math.sin(t * Math.PI * 2.5) - 60 * Math.cos(t * Math.PI * 5)]);
    }
    addCurve(pts);
  })();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
